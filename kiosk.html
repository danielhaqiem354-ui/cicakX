
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CicakX - Kiosk</title>

    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            
        <a class="navbar-brand fw-bold fst-italic" href="index.html">Cicak<span style="color: #ff3333;">X</span> </a>

            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#mainNavbar"
                    aria-controls="mainNavbar"
                    aria-expanded="false"
                    aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="mainNavbar">
                
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">

                    <li class="nav-item">
                        <a class="nav-link" href="index.html#home">
                            Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="index.html#founder">
                            Founder
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="kiosk.html">
                            Kiosk
                        </a>
                    </li>

                </ul>

            </div>
        </div>
    </nav>

    
    <!-- Hero Section -->
    <header class="hero-section kiosk-hero text-center text-white p-5">
        <div class="container">
            <h1 class="display-4">
                Cicak<span class="brand-x">X</span> Kiosk
            </h1>

            <p class="lead">
                Choose Your Superhero Equipment Package
            </p>
        </div>
    </header>


    <!-- Main Content -->
    <main class="container mt-5 mb-5">

        <div class="row justify-content-center">
            <div class="col-md-11">

                <div class="card form-card kiosk-card">
                    <div class="card-body">

                        <h2 class="card-title text-center mb-4">
                            Package Summary
                        </h2>

                        <!-- Subscription Form -->
                        <form id="subscriptionForm"
                              onsubmit="return validateForm()"
                              novalidate>

                            <!-- Customer Information -->
                            <fieldset>
                                <legend>Customer Information</legend>

                                <!-- Customer Name -->
                                <div class="mb-3">
                                    <label for="customerName"
                                           class="form-label">
                                        Customer Name
                                    </label>

                                    <input type="text"
                                           class="form-control"
                                           id="customerName"
                                           name="customerName"
                                           placeholder="Enter your name">

                                    <div id="customerNameError"
                                         class="text-danger"></div>
                                </div>

                                <!-- Email Address -->
                                <div class="mb-3">
                                    <label for="email"
                                           class="form-label">
                                        Email Address
                                    </label>

                                    <input type="email"
                                           class="form-control"
                                           id="email"
                                           name="email"
                                           placeholder="you@example.com">

                                    <div id="emailError"
                                         class="text-danger"></div>
                                </div>
                            </fieldset>

                            <!-- Subscription Details -->
                            <fieldset class="mt-4">
                                <legend>Subscription Details</legend>

                                <!-- Select Package -->
                                <div class="mb-3">
                                    <label for="package"
                                           class="form-label">
                                        Select Package
                                    </label>

                                    <select class="form-select"
                                            id="package"
                                            name="package">

                                        <option value="">
                                            -- Select Package --
                                        </option>

                                        <option value="50">
                                            Mask & Gloves - RM50/month
                                        </option>

                                        <option value="100">
                                            Superhero suit - RM100/month
                                        </option>

                                        <option value="150">
                                            Complete Hero Equipment - RM150/month
                                        </option>

                                    </select>

                                    <div id="packageError"
                                         class="text-danger"></div>
                                </div>

                                <!-- Subscription Duration -->
                                <div class="mb-3">
                                    <label for="duration"
                                           class="form-label">
                                        Subscription Duration
                                    </label>

                                    <select class="form-select"
                                            id="duration"
                                            name="duration">

                                        <option value="">
                                            -- Select Duration --
                                        </option>

                                        <option value="1">
                                            1 Month
                                        </option>

                                        <option value="6">
                                            6 Months
                                        </option>

                                        <option value="12">
                                            12 Months
                                        </option>

                                    </select>

                                    <div id="durationError"
                                         class="text-danger"></div>
                                </div>
                            </fieldset>

                            <!-- Subscription Discount -->
                            <fieldset class="mt-4">
                                <legend>Subscription Discount</legend>

                                <p>1 Month: No Discount</p>
                                <p>6 Months: 10% Discount</p>
                                <p>12 Months: 15% Discount</p>
                            </fieldset>

                            <!-- Calculate Button -->
                            <div class="d-grid mt-4">
                                <button type="submit"
                                        class="btn btn-primary btn-lg text-white">
                                    Calculate Subscription
                                </button>
                            </div>

                        </form>

                        <!-- Result Display -->
                        <div id="result" class="mt-4"></div>

                    </div>
                </div>

            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="footer mt-auto py-3 bg-dark text-white text-center">
        <div class="container">
            <p>&copy; 2026 CicakX - All Rights Reserved</p>
        </div>
    </footer>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- External JavaScript -->
    <script src="js/main.js"></script>

</body>
</html>
